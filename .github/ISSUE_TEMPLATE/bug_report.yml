name: Bug report
description: Report a reproducible problem with Weather Underground Uploader.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the integration. Search existing issues first.
        Never include a Weather Underground Station Key, real Station ID,
        credential-bearing URL, access token, or other private data.

  - type: input
    id: integration_version
    attributes:
      label: Integration version
      description: Find this on the installed HACS repository page or GitHub release.
      placeholder: 0.1.0
    validations:
      required: true

  - type: input
    id: home_assistant_version
    attributes:
      label: Home Assistant version
      placeholder: 2026.7.0
    validations:
      required: true

  - type: dropdown
    id: installation_method
    attributes:
      label: Installation method
      options:
        - HACS - fresh installation
        - HACS - update
        - Manual - fresh installation
        - Manual - update
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem description
      description: Describe what went wrong and when it occurs.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Provide the shortest sequence that consistently triggers the problem.
      placeholder: |
        1. Configure ...
        2. Select ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: |
        Drag a Home Assistant diagnostics file here when available. The Station Key
        is redacted automatically, but review the file because the Station ID and
        entity IDs may reveal private details about your installation.

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: |
        Paste only the relevant excerpt. Remove Station Keys, real Station IDs,
        credential-bearing Weather Underground URLs, tokens, private entity IDs,
        and all unrelated personal information.
      render: text

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: >-
            I reproduced this problem on the latest integration release compatible
            with a supported Home Assistant version.
          required: true
        - label: >-
            I removed all Station Keys, credentials, private station identifiers,
            tokens, private URLs, and other sensitive information from this report
            and its attachments.
          required: true
