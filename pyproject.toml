[project]
name = "home-assistant-weather-underground-uploader"
version = "0.2.0"
description = "Upload virtual Home Assistant weather stations to Weather Underground."
readme = "README.md"
authors = [{ name = "pokornyIt" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14.2,<3.15"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
  "pydoclint==0.9.1",
  "pre-commit>=4.6,<5",
  "pyright>=1.1.404,<2",
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "pytest-homeassistant-custom-component==0.13.348",
  "ruff>=0.16,<0.17",
]

[tool.pyright]
exclude = [".venv", "**/node_modules", "**/__pycache__", "**/.*"]
include = ["custom_components", "tests"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venv = ".venv"
venvPath = "."
reportMissingTypeStubs = false
reportTypedDictNotRequiredAccess = false
reportUnknownMemberType = false

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--cov=custom_components/weather_underground_uploader",
  "--cov-report=term-missing",
  "--cov-fail-under=95",
]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"

[tool.ruff.lint]
select = ["ANN", "B", "D", "E4", "E7", "E9", "F", "I", "N", "RUF", "SIM", "UP"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.pydoclint]
style = "sphinx"
arg-type-hints-in-docstring = false
check-return-types = false
check-yield-types = false
skip-checking-short-docstrings = false
native-mode-noqa-location = "definition"
allow-init-docstring = true
check-class-attributes = false
skip-checking-private-functions = false
